name: Quality Check

on:
  pull_request:
    branches: ['main', 'master']
  push:
    branches-ignore: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build
